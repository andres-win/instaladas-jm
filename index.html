<script>
/* ===== MEJORAS: Análisis y reportes ===== */
(function(){try{

 var bar=function(w,col){return '<i><s style="width:'+Math.max(2,Math.min(100,w))+'%;background:'+col+'"></s></i>'};

 };

  h+='<div class="card"><b>1. Por qué se cancelan las ventas</b>';

   return{a:a,i:c.inst,c:c.canc,d:d,p:d?Math.round(c.inst/d*100):null};
  });
  var ti=0,tcn=0;C.forEach(function(x){ti+=x.i;tcn+=x.c});
  var tp=(ti+tcn)?Math.round(ti/(ti+tcn)*100):0;

  h+='<div class="card"><div class="row"><b>2. Cuántas ventas concreta cada asesora</b><small style="flex:none;color:var(--mu)">Equipo '+tp+'%</small></div><div class="r2">Instaladas ÷ (instaladas + canceladas) del mes. De menor a mayor.</div>';

   return '<div class="bk"><b>'+e(x.a.name)+'</b>'+bar(x.p||0,low?'#FF6B57':'#1FB59A')+'<em style="font-size:18px;color:'+(low?'#FF6B57':'var(--tx)')+'">'+(x.p==null?'—':x.p+'%')+'</em></div><div class="r2" style="margin:-4px 0 4px 0">'+x.i+' instaladas · '+x.c+' canceladas'+(low?' · ⚠ conviene acompañarla':'')+'</div>';

<script>

(function(){try{
 var LIM_F=2,LIM_T=3;

 var fkey=function(x){return x.advisor_id+'|'+String(x.client||'').toUpperCase().replace(/\s+/g,' ').trim()};

 var aus=function(){var o=[];
  todos().forEach(function(a){

   (S.att||[]).forEach(function(r){if(r.advisor_id==a.id){if(r.st=='F')f++;if(r.st=='T')t++}});

  if(S.role=='sup'){
   var sp=ases().filter(function(a){return !a.profile}).length;
   if(sp)it.push({t:sp+' asesor(a)(s) sin perfil de meta',go:'ase',b:'Asignar'});
   var sr=['SUPERVISOR','BACK OFFICE'].filter(function(cg){
    return todos().some(function(a){return a.cargo==cg})&&!(S.ar||[]).some(function(x){return x.cargo==cg&&x.month==MO&&((x.weekly||[]).length||(x.monthly||[]).length||x.comm>0)});
   });
   if(sr.length)it.push({t:'Faltan reglas de bono: '+sr.join(', '),go:'met',b:'Metas'});
  }
  var sy=S.sync;
  if(sy&&(Date.now()-new Date(sy.at))/60000>120)it.push({t:'La sincronización con tu hoja no se actualiza hace más de 2 horas',go:'res',b:''});

  var T=S.team||[],n=tot();

   var c=calc(n,T),k=T.filter(function(x){return x<=c.proj}).length;
   if(k<T.length&&c.rem>0){
    var tg=T[k],ex=Math.max(1,Math.ceil((tg-n)/c.rem));

  FW.list=C;
  var cnt={PENDIENTE:0,CONTACTADA:0,RECUPERADA:0,PERDIDA:0};
  C.forEach(function(x){var f=fwm()[fkey(x)];cnt[f?f.state:'PENDIENTE']++});
  var h='<div class="card"><b>🔁 Seguimiento de ventas por recuperar</b><div class="r2">Pendientes '+cnt.PENDIENTE+' · Contactadas '+cnt.CONTACTADA+' · Recuperadas '+cnt.RECUPERADA+' · Perdidas '+cnt.PERDIDA+'</div>';
  h+=C.length?C.map(function(x,i){
   var f=fwm()[fkey(x)]||{},st=f.state||'PENDIENTE';
   return '<div class="ar"><div class="r1"><b style="font-weight:600">'+e(x.client)+'</b><span class="chip '+(st=='RECUPERADA'?'ok':'')+'">'+st+'</span><select class="ps wr" onchange="fwSet('+i+',this.value)">'+
    ST.map(function(s){return '<option '+(s==st?'selected':'')+'>'+s+'</option>'}).join('')+'</select><button class="s g wr" onclick="fwNote('+i+')">✎</button></div><div class="r2">'+
    e(nm[x.advisor_id]||'')+' · '+ddmm(x.day)+(f.note?' · '+e(f.note):'')+'</div></div>';
  }).join(''):'<div class="r2" style="margin-top:6px">Sin canceladas este mes 🎉</div>';
  h+='</div>';
  var V=(S.sg||[]).filter(function(x){return x.kind=='prog'&&x.day<hoy}).sort(byDay);
  h+='<div class="card"><b>⏰ Programadas con fecha vencida</b><div class="r2">Siguen como programadas aunque su fecha ya pasó. Revisa en la hoja si se instalaron, se reprogramaron o se cancelaron.</div>'+
   (V.length?V.map(function(x){return '<div class="ar"><div class="r1"><b style="font-weight:600">'+e(x.client)+'</b><span class="chip">'+ddmm(x.day)+'</span></div><div class="r2">'+e(nm[x.advisor_id]||'')+(x.slot?' · '+e(x.slot):'')+'</div></div>'}).join(''):'<div class="r2" style="margin-top:6px">Ninguna 🎉</div>')+'</div>';
  return h;
 };

 var ausHtml=function(){
  var o=aus();
  return '<div class="card"><b>6. Faltas y tardanzas del mes</b><div class="r2">Se marcan desde '+LIM_F+' faltas o '+LIM_T+' tardanzas.</div>'+
   (o.length?o.map(function(x){return '<div class="ar"><div class="r1"><b>'+e(x.a.name)+'</b><span class="chip">'+x.f+' falta'+(x.f==1?'':'s')+'</span><span class="chip">'+x.t+' tardanza'+(x.t==1?'':'s')+'</span></div></div>'}).join(''):'<div class="r2" style="margin-top:6px">Nadie llega al límite este mes 🎉</div>')+'</div>';
 };

 window.fwSet=async function(i,st){
  var x=FW.list[i];if(!x)return;
  var k=fkey(x),cur=fwm()[k]||{};
  var r=await sb.from('follow').upsert({k:k,state:st,note:cur.note||null,by_email:S.email,at:new Date().toISOString()});
  if(r.error){S.msg=(r.error.message||'').indexOf('follow')>=0?'Falta crear la tabla de seguimiento en Supabase (Pegado 1).':r.error.message}
  else{fwm()[k]={k:k,state:st,note:cur.note||null};S.msg='✔ Guardado'}
  sup();
 };
 window.fwNote=async function(i){
  var x=FW.list[i];if(!x)return;
  var k=fkey(x),cur=fwm()[k]||{};
  var n=prompt('Nota (opcional):',cur.note||'');
  if(n===null)return;
  var st=cur.state||'PENDIENTE';
  var r=await sb.from('follow').upsert({k:k,state:st,note:n.trim()||null,by_email:S.email,at:new Date().toISOString()});
  if(r.error){S.msg=r.error.message}else{fwm()[k]={k:k,state:st,note:n.trim()||null};S.msg='✔ Guardado'}
  sup();
 };

 var tabOrig2=tabHtml;
 tabHtml=function(c){
  var h=tabOrig2(c);
  try{
   if(S.tab=='res')h=panel()+h;
   else if(S.tab=='age')h+=agendaHtml();
   else if(S.tab=='ana')h+=ausHtml();
  }catch(x){console.error('mejoras2',x)}
  return h;
 };
}catch(x){console.error('mejoras2',x)}})();
</script>
