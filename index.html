<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INSTALADAS JM</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Instaladas JM">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0E1B3D">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#0E1B3D;--sun:#FF7A1A;--coral:#FF6B57;--mint:#1FB59A;--blue:#3B82F6;--amber:#F59E0B;--bg:#F5F6FB;--card:#fff;--tx:#0E1B3D;--mu:#5D6784}
@media(prefers-color-scheme:dark){:root{--bg:#0A1230;--card:#14214A;--tx:#F3F5FF;--mu:#9AA6CF}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:760px;margin:auto;padding:16px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:22px}
.hero h1{margin:0;font-size:24px;font-weight:800}.hero p{margin:6px 0 0;color:#DDE3FF;font-size:14px}
.logo{background:#fff;border-radius:14px;padding:8px 14px;display:inline-block;margin-bottom:14px}.logo img{display:block;height:40px}
.big{font-size:64px;font-weight:800;line-height:1;color:var(--sun);margin-top:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.st div{background:var(--card);border-radius:14px;padding:12px;cursor:pointer;border:2px solid transparent}.st div.on{border-color:var(--sun)}
.st small{color:var(--mu);display:block;font-size:12px}.st strong{font-size:24px}
input,button{font:inherit;border-radius:12px;border:1.5px solid #8a93b355;padding:11px;background:var(--card);color:var(--tx);width:100%;margin-top:8px}
button{background:var(--sun);color:var(--ink);font-weight:800;border:0;cursor:pointer}button.g{background:#8a93b333;color:var(--tx)}
.v{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #8a93b333}.v:last-child{border:0}
.v b{display:block}.v small{color:var(--mu);display:block;margin-top:2px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;color:#fff}
.instalada{background:var(--mint)}.programada{background:var(--blue)}.en_proceso{background:var(--amber)}.caida_recuperable{background:#A855F7}.caida{background:var(--coral)}
.rk{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #8a93b333}.rk.yo{color:var(--sun);font-weight:800}
textarea{font:inherit;border-radius:12px;border:1.5px dashed #8a93b388;padding:11px;background:var(--card);color:var(--tx);width:100%;margin-top:10px;min-height:70px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row3 button{margin:0;padding:11px 6px}
.fl{display:block;margin-top:10px}.fl span{font-size:12px;font-weight:600;color:var(--mu)}.fl input,.fl select{margin-top:4px}.fl small{display:block;margin-top:3px;font-size:12px}
select{font:inherit;border-radius:12px;border:1.5px solid #8a93b355;padding:11px;background:var(--card);color:var(--tx);width:100%}
hr{border:0;border-top:1px dashed #8a93b355;margin:14px 0 4px}.okm{color:var(--mint);font-weight:700}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tb button{margin:0;background:#8a93b333;color:var(--tx)}.tb button.on{background:var(--ink);color:var(--sun)}
.bad{border-color:var(--coral)!important;background:#ff6b5714!important}.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.row2>*{margin-top:4px}
.edok{background:#1fb59a22;border:1.5px solid var(--mint);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}.edno{background:#f59e0b22;border:1.5px solid var(--amber);border-radius:12px;padding:10px;margin-top:8px;font-size:13px}
.mu{color:var(--mu)}.err{color:var(--coral);font-weight:600}.ft{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 6px}
#tema{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:50;width:42px;height:42px;margin:0;padding:0;border-radius:50%;background:var(--card);color:var(--tx);border:1.5px solid #8a93b355;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media(max-width:600px){.w{padding:12px}.hero{padding:18px;border-radius:18px}.hero h1{font-size:21px;padding-right:44px}.big{font-size:52px}.card{padding:14px;border-radius:16px}
 .st{grid-template-columns:repeat(2,1fr);gap:8px}.st strong{font-size:21px}.v{flex-wrap:wrap}.row3{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.logo img{height:34px}}
</style></head><body><button id="tema" onclick="cambiaTema()" title="Modo claro / oscuro">🌙</button><div class="w" id="m"><p class="mu">Cargando…</p></div>
<script>
const VER="V06";
/* tema claro / oscuro */
function aplicaTema(t){document.querySelectorAll("style").forEach(st=>{if(st.dataset.o===undefined)st.dataset.o=st.textContent;const o=st.dataset.o;if(!/prefers-color-scheme\s*:\s*dark/.test(o))return;
 st.textContent=t?o.replace(/\(\s*prefers-color-scheme\s*:\s*dark\s*\)/g,t=="dark"?" all":" not all"):o});document.documentElement.style.colorScheme=t||"";const b=document.getElementById("tema");if(b)b.textContent=temaActual()=="dark"?"☀️":"🌙"}
function temaActual(){return document.documentElement.dataset.t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}
function cambiaTema(){const n=temaActual()=="dark"?"light":"dark";document.documentElement.dataset.t=n;aplicaTema(n);try{localStorage.jm_theme=n}catch(_){}}
try{const t=localStorage.jm_theme;if(t)document.documentElement.dataset.t=t;aplicaTema(t||"")}catch(_){}
const sb=supabase.createClient("https://znrcrkzlysyqeqiyercd.supabase.co","sb_publishable_qH2iEk0R59fgmQPqt2gP3A_AxXlomyY");
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EST={instalada:"Instaladas",programada:"Programadas",en_proceso:"En proceso",caida_recuperable:"Recuperables",caida:"Caídas"};
const UNO={instalada:"Instalada",programada:"Programada",en_proceso:"En proceso",caida_recuperable:"Recuperable",caida:"Caída"};
const MESES=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SETIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
let D=null,F="",ST=null,SEL="";
const MO=()=>new Date(Date.now()-5*3600000).toISOString().slice(0,7);
const nom=m=>((m||"").split("@")[0].replace(/_jm$/i,"").replace(/_/g," ")).toUpperCase()||"USUARIO";
const slug=n=>(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
const pie=()=>`<p class="ft">APP ${VER} · Grupo JM</p>`;
function codigo(){const u=new URLSearchParams(location.search).get("a");if(u){localStorage.setItem("jm_code",u.trim().toLowerCase());history.replaceState(null,"",location.pathname)}return localStorage.getItem("jm_code")||""}
function pedir(msg){$("#m").innerHTML=`<div class="hero"><div class="logo"><img src="logo.png" alt="Grupo JM"></div><h1>Instaladas JM</h1><p>Ingresa tu código de asesor para ver tus ventas.</p></div>
<div class="card">${msg?`<p class="err">${e(msg)}</p>`:""}<b>Asesores</b><input id="cd" placeholder="Tu código" autocapitalize="off" autocomplete="off"><button onclick="entrar()">Entrar</button></div>
<div class="card"><b>Jefatura y supervisión</b><p class="mu" style="margin:4px 0 0">Usa el mismo usuario y contraseña del CRM.</p><input id="lu" placeholder="Usuario o correo" autocapitalize="off" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password"><button onclick="entrarStaff()">Ingresar</button><p class="err" id="le"></p></div>${pie()}`}
async function entrarStaff(){const u=$("#lu").value.trim(),p=$("#lp").value;if(!u||!p)return;$("#le").textContent="Ingresando…";
 const{error}=await sb.auth.signInWithPassword({email:u.includes("@")?u:slug(u)+"_jm@gmail.com",password:p});
 if(error)return $("#le").textContent="Usuario o contraseña incorrectos.";const r=await sb.rpc("crm_rol");
 if(!r.data){await sb.auth.signOut();return $("#le").textContent="Tu usuario no tiene un rol asignado en el CRM."}staff()}
async function todas(){let r=[],i=0;for(;;){const{data,error}=await sb.from("registro_ventas").select("doc,cliente,fecha_registro,fecha_txt,fecha_inst,plan,estado,status_txt,rango_inst,asesor_id,equipo").eq("en_hoja",true).eq("mes",MO()).order("doc").range(i,i+999);if(error)throw error;r=r.concat(data);if(data.length<1000)break;i+=1000}return r}
async function staff(){try{const[{data:{user}},R,A,S,ro]=await Promise.all([sb.auth.getUser(),todas(),sb.from("asesores").select("id,nombre").then(x=>x.data||[]),sb.from("sync_central").select("at").eq("id",1).then(x=>(x.data||[])[0]),sb.rpc("crm_rol")]);
 const AN={};A.forEach(a=>AN[a.id]=a.nombre);ST={user:nom(user&&user.email),rol:ro.data,R,AN,at:S&&S.at};pStaff()}catch(x){$("#m").innerHTML=`<div class="card"><p class="err">No se pudo cargar.</p><p class="mu">${e(x.message||x)}</p><button onclick="staff()">Reintentar</button><button class="g" onclick="salirStaff()">Cerrar sesión</button></div>${pie()}`}}
function aVenta(r){const f=x=>x?x.slice(8,10)+"/"+x.slice(5,7):"";return{c:r.cliente,d:(r.doc||"").slice(-4),f:f(r.fecha_registro)||r.fecha_txt||"",fi:f(r.fecha_inst),p:r.plan,e:r.estado,s:r.status_txt||"PENDIENTE",r:r.rango_inst}}
function verAsesor(id){SEL=id;F="";const R=ST.R.filter(r=>(r.asesor_id||"-")==id);D={nombre:id=="-"?"SIN ASIGNAR":(ST.AN[id]||"?"),mes:MO(),actualizado:ST.at,ventas:R.map(aVenta),equipo:rank()};pintar()}
function rank(){const c={};ST.R.forEach(r=>{if(r.estado=="instalada"){const n=ST.AN[r.asesor_id]||"SIN ASIGNAR";c[n]=(c[n]||0)+1}});return Object.keys(c).map(n=>({n,i:c[n]})).sort((a,b)=>b.i-a.i||a.n.localeCompare(b.n))}
function pStaff(){SEL="";D=null; const R=ST.R,cnt=L=>{const o={t:L.length};Object.keys(EST).forEach(k=>o[k]=L.filter(v=>v.estado==k).length);return o},T=cnt(R);
 const [y,mm]=MO().split("-"),mins=ST.at?Math.round((Date.now()-new Date(ST.at))/60000):null,pa={},pe={};
 R.forEach(r=>{(pa[r.asesor_id||"-"]=pa[r.asesor_id||"-"]||[]).push(r);(pe[r.equipo||"SIN EQUIPO"]=pe[r.equipo||"SIN EQUIPO"]||[]).push(r)});
 const fa=Object.keys(pa).map(k=>({k,n:k=="-"?"SIN ASIGNAR":(ST.AN[k]||"?"),c:cnt(pa[k])})).sort((a,b)=>b.c.instalada-a.c.instalada||b.c.t-a.c.t);
 $("#m").innerHTML=`<div class="hero"><div class="logo"><img src="logo.png" alt="Grupo JM"></div><h1>Hola, ${e(ST.user)}</h1><p>${e(String(ST.rol||"").replace(/_/g," ").toUpperCase())} · Equipo completo · ${MESES[+mm-1]} ${y}</p>
 <div class="big">${T.instalada}</div><p>instaladas del equipo de ${T.t} venta(s)</p></div>
 <div class="st">${Object.keys(EST).map(k=>`<div><small>${EST[k]}</small><strong>${T[k]}</strong></div>`).join("")}</div>
 <div class="card"><b>Por equipo</b>${Object.keys(pe).sort().map(k=>{const c=cnt(pe[k]);return`<div class="rk"><span>${e(k)}</span><span>${c.instalada} inst. · ${c.t} ventas</span></div>`}).join("")}</div>
 <div class="card"><b>Por asesor</b> <span class="mu">· toca uno para ver sus ventas</span>${fa.map((x,i)=>`<div class="rk" style="cursor:pointer" onclick="verAsesor('${x.k}')"><span>${i+1}. ${e(x.n)}</span><span>${x.c.instalada} inst. · ${x.c.programada} prog. · ${x.c.t} total ›</span></div>`).join("")||`<p class="mu">Sin ventas este mes.</p>`}</div>
 <div class="card"><p class="mu" style="margin:0">${mins==null?"Todavía no hay sincronización.":`Datos actualizados hace ${mins} min.`}</p><button onclick="staff()">Actualizar</button><button class="g" onclick="salirStaff()">Cerrar sesión</button></div>${pie()}`}
async function salirStaff(){await sb.auth.signOut();ST=null;pedir()}
function entrar(){const c=$("#cd").value.trim().toLowerCase();if(!c)return;localStorage.setItem("jm_code",c);cargar()}
function salir(){localStorage.removeItem("jm_code");D=null;pedir()}
async function cargar(){const c=codigo();if(!c)return pedir();
 const{data,error}=await sb.rpc("app_asesor",{p_codigo:c});
 if(error)return $("#m").innerHTML=`<div class="card"><p class="err">No se pudo conectar. Revisa tu internet.</p><p class="mu">${e(error.message)}</p><button onclick="cargar()">Reintentar</button></div>${pie()}`;
 if(!data){localStorage.removeItem("jm_code");return pedir("Ese código no existe o está desactivado. Pídele tu link a tu supervisor.")}
 D=data;pintar()}
function pintar(){ const V=D.ventas||[],cnt={};Object.keys(EST).forEach(k=>cnt[k]=V.filter(v=>v.e==k).length);
 const [y,mm]=(D.mes||"").split("-"),mes=MESES[+mm-1]||"";const L=F?V.filter(v=>v.e==F):V;
 const mins=D.actualizado?Math.round((Date.now()-new Date(D.actualizado))/60000):null;
 const hora=new Date().getHours(),sal=hora<12?"Buenos días":hora<19?"Buenas tardes":"Buenas noches";
 $("#m").innerHTML=`${ST?`<button class="g" style="margin:0 0 12px" onclick="pStaff()">← Volver al equipo</button>`:""}<div class="hero"><div class="logo"><img src="logo.png" alt="Grupo JM"></div><h1>${ST?e(D.nombre):`${sal}, ${e(D.nombre)}`}</h1><p>${mes} ${y||""}</p>
 <div class="big">${cnt.instalada}</div><p>instaladas este mes${V.length?` de ${V.length} venta(s)`:""}</p></div>
 <div class="st">${Object.keys(EST).map(k=>`<div class="${F==k?"on":""}" onclick="F=F=='${k}'?'':'${k}';pintar()"><small>${EST[k]}</small><strong>${cnt[k]}</strong></div>`).join("")}</div>
 <div class="card"><b>${F?EST[F]:(ST?"Sus ventas":"Todas mis ventas")}</b> <span class="mu">(${L.length})</span>${F?` · <a href="#" onclick="F='';pintar();return false">ver todas</a>`:""}
 ${L.length?L.map(v=>`<div class="v"><div><b>${e(v.c||"—")}</b><small>Doc. ****${e(v.d)} · ${e(v.p||"POR DEFINIR")}</small><small>Venta: ${e(v.f||"—")}${v.fi?` · Instalación: ${e(v.fi)}`:""}${v.r&&v.e=="programada"?` · ${e(v.r)}`:""}</small></div><div style="text-align:right"><span class="chip ${e(v.e)}">${UNO[v.e]||e(v.e)}</span><small class="mu">${e(v.s)}</small></div></div>`).join(""):`<p class="mu">Todavía no tienes ventas aquí este mes.</p>`}</div>
 <div class="card"><b>Ranking del equipo</b> <span class="mu">· instaladas del mes</span>${(D.equipo||[]).map((x,i)=>`<div class="rk ${x.n==D.nombre?"yo":""}"><span>${i+1}. ${e(x.n)}</span><span>${x.i}</span></div>`).join("")||`<p class="mu">Sin datos todavía.</p>`}</div>
 ${ST?"":`<div class="card"><p class="mu" style="margin:0">${mins==null?"Todavía no hay sincronización.":`Datos actualizados hace ${mins} min.`}</p><button onclick="cargar()">Actualizar</button><button class="g" onclick="salir()">Cambiar de usuario</button></div>`}${pie()}`}
</script><script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{try{const{data:{session}}=await sb.auth.getSession();if(session){const r=await sb.rpc("crm_rol");if(r.data)return staff()}}catch(_){}cargar()})();
setInterval(()=>{if(document.visibilityState!="visible")return;if(ST&&!SEL)staff();else if(!ST&&D)cargar()},300000);
</script></body></html>
