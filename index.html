 <button onclick="saveMetas()">Guardar metas de ${MO}</button><button class="g" onclick="copyPrev()">Copiar metas del mes anterior</button>`;
 if(S.tab=='ase')return`${S.adv.map(a=>`<div class="ar"><div class="r1"><b style="${a.active?'':'opacity:.5'}">${e(a.name)}</b><select class="ps" onchange="upd('${a.id}',{profile:this.value||null})"><option value="">Sin perfil</option>${S.prof.map(p=>`<option ${a.profile==p.name?'selected':''}>${e(p.name)}</option>`).join('')}</select><button class="s g" onclick="const d=this.closest('.ar').querySelector('.mo');d.hidden=!d.hidden">⋯</button></div>
<div class="mo" hidden><input placeholder="Meta especial (opcional)" value="${(a.custom_tiers||[]).join(', ')}" onchange="upd('${a.id}',{custom_tiers:parseT(this.value).length?parseT(this.value):null})"><div class="row" style="margin-top:6px"><label><input type="checkbox" style="width:auto;margin:0 6px 0 0" ${a.active?'checked':''} onchange="upd('${a.id}',{active:this.checked})">Activo</label><button class="s g" onclick="navigator.clipboard.writeText(location.origin+location.pathname+'?a=${a.code}');this.textContent='¡Link copiado!'">Copiar link</button><button class="s g" onclick="newCode('${a.id}')">Nuevo link</button><button class="s g" onclick="delAdv('${a.id}')">Quitar</button></div></div></div>`).join('')}
<div class="row" style="margin-top:12px"><input id="na" placeholder="Nuevo asesor (como viene en el reporte)"><button class="s" onclick="addAdv($('#na').value)">Agregar</button></div>`;
 if(S.tab=='cie'){const rows=[{month:MO,live:1,data:{total:tot(),team_tiers:S.team,advisors:S.adv.filter(a=>a.active).map(a=>({name:a.name,n:S.ins[a.id]?.n||0}))}},...S.cl.filter(r=>r.month!=MO)];
return`<p>Guarda el resumen final de <b>${MO}</b> en el histórico. El mes siguiente empieza en cero automáticamente.</p><button onclick="closeMonth()">Cerrar mes ${MO}</button>
<b style="display:block;margin-top:16px">Histórico de meses</b>${rows.map((r,i)=>{const d=r.data,pv=rows[i+1]?.data?.total,df=pv==null?'':' ('+(d.total-pv>=0?'+':'')+(d.total-pv)+' vs mes anterior)',T=d.team_tiers||[];
return`<details style="margin-top:8px"><summary><b>${r.month}${r.live?' (en curso)':''}</b>: ${d.total} instaladas · tramo ${T.filter(x=>x<=d.total).length}/${T.length}${df}</summary><table>${[...d.advisors].sort((x,y)=>y.n-x.n).map(x=>`<tr><td>${e(x.name)}</td><td>${x.n}</td></tr>`).join('')}</table></details>`}).join('')}`}}
function prev(){S.txt=$('#tx').value;const m={};$('#tx').value.split('\n').forEach(l=>{l=l.replace(/[^\x20-\x7E\u00C0-\u017F\t]/g,'').trim();const x=l.match(/^(.*?)[\t ,;]+(\d+)\s*$/);if(!x)return;const nm=x[1].replace(/\s+/g,' ').trim().toUpperCase();if(!nm||nm=='LAZO')return;m[nm]=(m[nm]||0)+ +x[2]});S.P=m;sup()}
async function savePaste(){const rows=S.adv.filter(a=>a.active).map(a=>({month:MO,advisor_id:a.id,n:S.P[a.name.toUpperCase()]||0,updated_at:new Date().toISOString()}));
 const dr=S.adv.filter(a=>a.active&&(S.ins[a.id]?.n||0)>(S.P[a.name.toUpperCase()]||0)).map(a=>a.name+' ('+S.ins[a.id].n+' → '+(S.P[a.name.toUpperCase()]||0)+')');if(dr.length&&!confirm('Estos asesores BAJARÍAN:\n'+dr.join('\n')+'\n¿Guardar igual?'))return;
 const{error}=await sb.from('installs').upsert(rows);S.msg=error?error.message:'✔ Avance guardado';if(!error){S.P=null;await load()}sup()}
async function addAdv(n){n=(n||'').trim().toUpperCase().replace(/\s+/g,' ');if(!n)return;const{error}=await sb.from('advisors').insert({name:n});S.msg=error?error.message:'';await load();sup()}
async function upd(id,o){await sb.from('advisors').update(o).eq('id',id);await load();sup()}
function newCode(id){if(confirm('El link anterior dejará de funcionar. ¿Generar uno nuevo?')){const c=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('');upd(id,{code:c})}}
async function delAdv(id){if(confirm('¿Quitar este asesor y su avance?')){await sb.from('advisors').delete().eq('id',id);await load();sup()}}
async function saveMetas(){const tt=parseT($('#tt').value);await sb.from('settings').upsert({month:MO,team_tiers:tt});
 const rows=S.prof.map(p=>({month:MO,name:p.name,tiers:parseT($('[id="pf_'+p.name+'"]').value)}));const nn=$('#pn').value.trim().toUpperCase(),nt=parseT($('#pt').value);if(nn&&nt.length)rows.push({month:MO,name:nn,tiers:nt});
 if(rows.length)await sb.from('profiles').upsert(rows);S.msg='✔ Metas guardadas';await load();sup()}
async function copyPrev(){const d=new Date(now.getFullYear(),now.getMonth()-1,1),pm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 const[{data:p},{data:s}]=await Promise.all([sb.from('profiles').select('*').eq('month',pm),sb.from('settings').select('*').eq('month',pm)]);
 if(p?.length)await sb.from('profiles').upsert(p.map(x=>({...x,month:MO})));if(s?.length)await sb.from('settings').upsert({month:MO,team_tiers:s[0].team_tiers});
 S.msg='✔ Metas copiadas. Ajusta lo que cambie.';await load();sup()}
async function closeMonth(){if(!confirm('¿Cerrar '+MO+'?'))return;const n=tot(),data={team_tiers:S.team,total:n,advisors:S.adv.filter(a=>a.active).map(a=>({name:a.name,n:S.ins[a.id]?.n||0,tiers:tiersOf(a)}))};
 const{error}=await sb.from('closes').upsert({month:MO,data});S.msg=error?error.message:'✔ Mes cerrado y guardado en el histórico';await load();sup()}

let hid=0,ADV=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>(ADV?30000:300000))location.reload()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{const q=new URLSearchParams(location.search).get('a')||localStorage.getItem('jm_code');
 const{data:{session}}=await sb.auth.getSession();
 if(session)return supInit();if(q)return goAdv(q);if(localStorage.jm_auto=='1'&&localStorage.jm_u&&localStorage.jm_p){const{error}=await sb.auth.signInWithPassword({email:localStorage.jm_u,password:decodeURIComponent(atob(localStorage.jm_p))});if(!error)return supInit()}login()})();
</script></body></html>
